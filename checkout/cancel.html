<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout Cancelled — Cited</title>
  <meta name="description" content="Your checkout was cancelled. You can try again anytime to start your Bot AEO Monthly service." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0a'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='%23f5f5f4'%3EC%3C/text%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #f5f5f4;
      display: grid;
      place-items: center;
      padding: 2rem;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 120, 255, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(56, 189, 248, 0.08), transparent);
    }
    main {
      max-width: 36rem;
      text-align: center;
    }
    .cancel-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.2);
      border: 2px solid #ef4444;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 650;
      letter-spacing: -0.03em;
      margin: 0 0 0.75rem;
    }
    p {
      margin: 0 0 1rem;
      color: #a1a1aa;
      line-height: 1.6;
      font-size: 1.05rem;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 2rem;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    .btn-primary:hover {
      background: #2563eb;
    }
    .btn-secondary {
      background: #27272a;
      color: #f5f5f4;
      border: 1px solid #404040;
    }
    .btn-secondary:hover {
      background: #3f3f46;
    }
    @media (max-width: 768px) {
      .btn-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="cancel-icon">×</div>
    <h1>Checkout Cancelled</h1>
    <p>No worries! Your checkout was cancelled and no payment was processed.</p>
    <p>You can try again anytime to start your Bot AEO Monthly service. We're here when you're ready.</p>
    <div class="btn-group">
      <a href="/#pricing" class="btn btn-primary">View Pricing</a>
      <a href="/" class="btn btn-secondary">Return to Homepage</a>
    </div>
  </main>
</body>
</html>
